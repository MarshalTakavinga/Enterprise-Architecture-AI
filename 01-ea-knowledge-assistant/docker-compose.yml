# Full stack: PostgreSQL + pgvector, FastAPI backend, Streamlit UI.
#   cp .env.example .env   # optional: add an LLM / embedding provider key
#   docker compose up --build
# UI: http://localhost:8501   API docs: http://localhost:8000/docs
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eaka
      POSTGRES_PASSWORD: eaka
      POSTGRES_DB: eaka
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eaka"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: infra/Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment:
      EAKA_STORE: pgvector
      EAKA_DATABASE_URL: postgresql://eaka:eaka@db:5432/eaka
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }

  ui:
    build: { context: ., dockerfile: infra/Dockerfile }
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    env_file: [{ path: .env, required: false }]
    environment:
      EAKA_API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  pgdata:
