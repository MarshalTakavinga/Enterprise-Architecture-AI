[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-knowledge-assistant"
version = "1.0.0"
description = "Retrieval-augmented, citation-grounded Q&A over an enterprise architecture repository"
authors = [{ name = "Marshal Tafadzwa Takavinga" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "snowballstemmer>=2.2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
pgvector = ["psycopg[binary]>=3.1", "pgvector>=0.2.5"]
llm = ["anthropic>=0.34", "openai>=1.40"]
local-embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]
all = ["ea-knowledge-assistant[ui,pgvector,llm,dev]"]

[project.scripts]
eaka = "eaka.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["pgvector: needs a PostgreSQL + pgvector database (EAKA_TEST_DATABASE_URL)"]
