# Hand-labelled evaluation set for the EA Knowledge Assistant.
#
# relevant_docs : documents that genuinely answer the question (a retrieved chunk from any of
#                 them counts as relevant). Primary source first.
# answer_keywords: facts a correct answer must mention (checked in the answer text, case-insensitive;
#                 any one alternative separated by "|" is enough).
# split         : dev = used to tune the not-found threshold; test = reported numbers only.
# expect        : answer | not_found
#
# Questions are deliberately paraphrased (they don't copy section headings) so that retrieval is
# tested on how architects actually ask, not on keyword echo.

queries:
  # ---------------------------------------------------------------- integration & APIs
  - id: q01
    split: test
    question: "What's our approved pattern for asynchronous integration between domains?"
    relevant_docs: [STD-INT-001, AP-CATALOG, RA-01, ADR-0038, ADR-0030]
    answer_keywords: ["INT-P1|Domain Event Publication"]
  - id: q02
    split: dev
    question: "Can my new service read directly from another domain's database?"
    relevant_docs: [STD-INT-001, AP-CATALOG]
    answer_keywords: ["prohibit|MUST NOT|not permitted"]
  - id: q03
    split: test
    question: "Is it still OK to build new MuleSoft flows?"
    relevant_docs: [ADR-0015, STD-INT-001, STD-TLC-014]
    answer_keywords: ["2025-06-30|30 June 2025"]
  - id: q04
    split: test
    question: "How should we name Kafka topics?"
    relevant_docs: [STD-EVT-003, RA-01]
    answer_keywords: ["<domain>.<entity>.<event>.v<major>|shipment.milestone.recorded.v1"]
  - id: q05
    split: dev
    question: "What do I do if an event payload is bigger than the Kafka message size limit?"
    relevant_docs: [STD-EVT-003, RA-01]
    answer_keywords: ["claim-check|claim check"]
  - id: q06
    split: test
    question: "How do we version REST APIs and how much notice is required before deprecating one?"
    relevant_docs: [STD-API-002]
    answer_keywords: ["6 months|six months"]
  - id: q07
    split: test
    question: "Why did we pick Confluent Cloud rather than Azure Event Hubs for eventing?"
    relevant_docs: [ADR-0007]
    answer_keywords: ["schema registry|Schema Registry|portab"]
  - id: q08
    split: test
    question: "How does the customer portal get shipment status updates?"
    relevant_docs: [ADR-0030, RA-01, STD-INT-001]
    answer_keywords: ["event-carried state transfer|INT-P2|read model"]
  - id: q09
    split: dev
    question: "How do HSP services publish domain events consistently with their database writes?"
    relevant_docs: [ADR-0038, RA-01, STD-INT-001]
    answer_keywords: ["outbox"]
  - id: q10
    split: test
    question: "Which API gateway product is the standard and why was it selected?"
    relevant_docs: [ADR-0019, STD-API-002]
    answer_keywords: ["API Management|APIM"]

